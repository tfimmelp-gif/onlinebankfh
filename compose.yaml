name: northstar-bank

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "4007"
  HOSTNAME: "0.0.0.0"
  NORTHSTAR_HOST: ${NORTHSTAR_HOST:?Set NORTHSTAR_HOST in .env}
  DATABASE_URL: postgresql://northstar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/northstar
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-12}
  REDIS_URL: redis://redis:6379/0
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-northstar-private}
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?Set ADMIN_TOTP_SECRET in .env}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
  CUSTOMER_SESSION_SECRET: ${CUSTOMER_SESSION_SECRET:?Set CUSTOMER_SESSION_SECRET in .env}
  EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:?Set EMAIL_OTP_SECRET in .env}
  CUSTOMER_EMAIL: ${CUSTOMER_EMAIL:-}
  CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  WRANGLER_WRITE_LOGS: "false"
  WRANGLER_LOG_PATH: /tmp/wrangler.log

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["./node_modules/.bin/tsx", "scripts/migrate-vps.mjs"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["npm", "run", "start"]
    init: true
    expose: ["4007"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4007/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    logging: *default-logging
    restart: unless-stopped
    networks: [frontend, backend]

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2.0
    logging: *default-logging
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped
    networks: [backend]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped
    networks: [backend]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}" &&
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-northstar-private}
    networks: [backend]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    environment:
      NORTHSTAR_HOST: ${NORTHSTAR_HOST:?Set NORTHSTAR_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    logging: *default-logging
    networks: [frontend]

volumes:
  postgres_data:
  redis_data:
  object_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
